name: Surveille B2 Yaounde

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Mode test (true/false)"
        default: "false"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Verification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python surveille_b2.py debug
          else
            python surveille_b2.py
          fi
      - name: Sauvegarde de l'etat
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add baseline.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "maj etat" && git push)
